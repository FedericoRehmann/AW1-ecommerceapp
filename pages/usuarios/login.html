<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/style.css" />
    <title>E-Ring | Iniciar sesión</title>
  </head>
  <body>
    <header class="auth-header">
      <a
        class="auth-brand"
        href="../../index.html"
        aria-label="Ir al inicio de E-Ring"
      >
        <img class="brand-logo" src="../../img/logo-e-ring.png" alt="" />
      </a>
    </header>
    <main class="auth-main">
      <section class="auth-card" aria-labelledby="login-title">
        <h1 class="auth-title" id="login-title">Iniciar sesión</h1>

        <p class="auth-description">
          Ingresá a tu cuenta para continuar tu aventura.
        </p>
        <form class="auth-form">
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="nombre@ejemplo.com"
              required
            />
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="Ingresá tu contraseña"
              required
            />
          </div>
          <button class="auth-button" type="submit">Iniciar sesión</button>
        </form>
        <p class="auth-switch">
          ¿No tenés una cuenta?
          <a href="registro.html">Registrate</a>
        </p>
      </section>
    </main>
    <footer class="site-footer">
      <p>&copy; 2026 E-Ring</p>
    </footer>
  </body>
</html>
