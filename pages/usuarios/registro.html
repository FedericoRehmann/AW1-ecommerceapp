<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/style.css" />
    <title>E-Ring | Registrarse</title>
  </head>
  <body>
    <header class="auth-header">
      <a
        class="auth-brand"
        href="../../index.html"
        aria-label="Ir al inicio de E-Ring"
      >
        <img class="brand-logo" src="../../img/logo-e-ring.png" alt="" />
      </a>
    </header>
    <main class="auth-main">
      <section class="auth-card" aria-labelledby="register-title">
        <h1 class="auth-title" id="register-title">Crear una cuenta</h1>
        <p class="auth-description">
          Registrate y preparate para conquistar las Tierras Intermedias.
        </p>
        <form class="auth-form">
          <div class="form-group">
            <label for="first-name">Nombre</label>
            <input
              type="text"
              id="first-name"
              name="first-name"
              autocomplete="given-name"
              placeholder="Ingresá tu nombre"
              required
            />
          </div>
          <div class="form-group">
            <label for="last-name">Apellido</label>
            <input
              type="text"
              id="last-name"
              name="last-name"
              autocomplete="family-name"
              placeholder="Ingresá tu apellido"
              required
            />
          </div>
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="nombre@ejemplo.com"
              required
            />
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="new-password"
              placeholder="Creá una contraseña"
              required
            />
          </div>
          <div class="form-group">
            <label for="birth-date">Fecha de nacimiento</label>
            <input
              type="date"
              id="birth-date"
              name="birth-date"
              autocomplete="bday"
              required
            />
          </div>
          <button class="auth-button" type="submit">Crear cuenta</button>
        </form>
        <p class="auth-switch">
          ¿Ya tenés una cuenta?
          <a href="login.html">Iniciá sesión</a>
        </p>
      </section>
    </main>
    <footer class="site-footer">
      <p>&copy; 2026 E-Ring</p>
    </footer>
  </body>
</html>
